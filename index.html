<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natalie Kim - Link in Bio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <main class="container">
        <!-- Profile Image -->
        <div class="profile-img-wrapper">
            <img src="https://ik.imagekit.io/lzl0sgfim/WhatsApp%20Image%202026-09-24%20at%2018.26.39.jpeg"
                alt="Natalie Kim" class="profile-img">
        </div>

        <!-- Profile Details -->
        <h1 class="name">Taffany Williamson</h1>
        <p class="tagline">@taffany_williamson</p>
        <p class="bio">As an Amazon Associate, I earn from qualifying purchases.</p>

        <!-- Social Icons -->
        <div class="social-icons">
            <a href="https://instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://tiktok.com" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://youtube.com" target="_blank"><i class="fa-brands fa-youtube"></i></a>
        </div>

        <!-- Action Links -->
        <div class="links">
            <a href="#" class="link-btn">Amazon storefront</a>
            <a href="#" class="link-btn">Instagram virals</a>
            <a href="#" class="link-btn">Space Saving Things</a>
        </div>
    </main>

</body>

</html>
